# ==============================================================================
# Nginx Reverse-Proxy Configuration Examples for AI Student Analyzer
# ==============================================================================
# This configuration demonstrates both:
# 1. Reverse-proxy at domain root: https://<DOMAIN>/
# 2. Reverse-proxy under a URL prefix: https://<DOMAIN>:8054/student-analysis/
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream container / backend server
    upstream student_analyzer_backend {
        server 127.0.0.1:8051;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Scenario A: Reverse-Proxy under a URL Prefix (e.g. /student-analysis/)
    # --------------------------------------------------------------------------
    server {
        listen 8054 ssl;
        server_name example.com;

        # SSL Certificates (adjust paths to match your certificate files)
        # ssl_certificate     /etc/ssl/certs/example.com.crt;
        # ssl_certificate_key /etc/ssl/private/example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Set maximum upload size to match application limit (25 MB)
        client_max_body_size 25M;

        # Redirect bare prefix without trailing slash to prefix with trailing slash
        location = /student-analysis {
            return 308 https://$http_host/student-analysis/;
        }

        # Proxy location for the application
        location /student-analysis/ {
            # Option 1 (Recommended): Pass request directly with X-Forwarded-Prefix
            proxy_pass http://student_analyzer_backend;

            # Forwarded headers required for URL generation and scheme preservation
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /student-analysis;

            # Timeouts for longer AI analysis requests
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # HTTP/1.1 and keepalive support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # --------------------------------------------------------------------------
    # Scenario B: Standard Domain Root Reverse-Proxy (http:// or https://)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name example.com;

        # Set maximum upload size (25 MB)
        client_max_body_size 25M;

        location / {
            proxy_pass http://student_analyzer_backend;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
